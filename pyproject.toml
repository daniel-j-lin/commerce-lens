[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "commerce-lens"
version = "0.1.3"
description = "CommerceLens AI deterministic foundation package"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0,<2",
    "openpyxl>=3.1,<4",
    "pydantic>=2.7,<3",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
