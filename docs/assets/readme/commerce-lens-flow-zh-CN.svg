<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">CommerceLens 受治理的分析流程</title>
  <desc id="desc">业务问题依次经过 mapping、完整性、确定性计算、机械分解、受治理的假设与证据 admission。证据不足时停止不受支持的解释；证据充足时进行已批准的诊断测试、独立验证与有边界的诊断解释。关联不等于因果。</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
  <style>.box{fill:#f8fafc;stroke:#475569;stroke-width:2}.ok{fill:#ecfdf5;stroke:#047857;stroke-width:2}.stop{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.t{fill:#0f172a;font:600 18px system-ui,sans-serif}.s{fill:#334155;font:15px system-ui,sans-serif}.a{fill:none;stroke:#64748b;stroke-width:3;marker-end:url(#arrow)}</style>
  <g text-anchor="middle">
    <rect id="input" class="box" x="500" y="20" width="400" height="58" rx="12"/><text class="t" x="700" y="55">输入／业务问题</text>
    <path class="a" d="M700 78V108"/>
    <rect id="mapping" class="box" x="500" y="110" width="400" height="58" rx="12"/><text class="t" x="700" y="145">Mapping + 完整性</text>
    <path class="a" d="M700 168V198"/>
    <rect id="calculation" class="box" x="500" y="200" width="400" height="58" rx="12"/><text class="t" x="700" y="235">确定性计算</text>
    <path class="a" d="M700 258V288"/>
    <rect id="decomposition" class="box" x="500" y="290" width="400" height="58" rx="12"/><text class="t" x="700" y="325">机械分解</text>
    <path class="a" d="M700 348V378"/>
    <rect id="hypothesis" class="box" x="500" y="380" width="400" height="58" rx="12"/><text class="t" x="700" y="415">受治理的假设</text>
    <path class="a" d="M700 438V468"/>
    <rect id="admission" class="box" x="500" y="470" width="400" height="58" rx="12"/><text class="t" x="700" y="505">证据／Admission 检查</text>
    <path class="a" d="M600 528V570H300V600"/><text class="s" x="415" y="562">证据不足</text>
    <path class="a" d="M800 528V570H1100V600"/><text class="s" x="985" y="562">证据充足</text>
    <rect id="refusal" class="stop" x="100" y="602" width="400" height="82" rx="12"/><text class="t" x="300" y="637">停止不受支持的原因主张</text><text class="s" x="300" y="663">说明缺少的证据</text>
    <rect id="diagnostic" class="ok" x="900" y="602" width="400" height="82" rx="12"/><text class="t" x="1100" y="635">已批准的诊断测试</text><text class="s" x="1100" y="661">确定性执行</text>
    <path class="a" d="M1100 684V714"/>
    <rect id="validation" class="ok" x="760" y="716" width="300" height="64" rx="12"/><text class="t" x="910" y="754">独立验证</text>
    <path class="a" d="M1060 748H1090"/>
    <rect id="explanation" class="ok" x="1092" y="706" width="280" height="84" rx="12"/><text class="t" x="1232" y="741">有边界的诊断</text><text class="t" x="1232" y="765">解释</text>
    <text class="t" x="300" y="748">关联 ≠ 因果</text>
  </g>
</svg>
